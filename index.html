<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Records | Digital Fleet Management</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Mock Data simulating the Database Content
        const mockAssets = [
            { id: 1, reg: 'N789GE', model: 'GE9X Engine', operator: 'Global Cargo', status: 'In Service' },
            { id: 2, reg: 'N452AX', model: 'Boeing 737', operator: 'Pacific Air', status: 'Lease Transfer' },
            { id: 3, reg: 'G-XLEA', model: 'Airbus A380', operator: 'Atlantic Lease', status: 'MRO Visit' },
        ];

        const mockRecords = [
            { id: 101, name: 'Fan Blade Inspection', ata: '72-00-00', iata: 'PKG-01', asset: 'N789GE', date: '2023-10-12', compliant: true },
            { id: 102, name: 'Landing Gear Overhaul', ata: '32-10-00', iata: 'PKG-04', asset: 'N452AX', date: '2023-11-01', compliant: true },
            { id: 103, name: 'Avionics Upgrade Cert', ata: '34-00-00', iata: 'PKG-02', asset: 'N452AX', date: '2023-11-05', compliant: false },
        ];

        const mockProjects = [
            { id: 1, name: 'Lease Return - N452AX', asset: 'N452AX', status: 'In Progress', progress: 65, tasks: '12/18' },
            { id: 2, name: 'Annual Audit - Fleet A', asset: 'Fleet Wide', status: 'Planning', progress: 10, tasks: '2/20' },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [searchQuery, setSearchQuery] = useState('');

            // Filter logic for Search and Retrieve 
            const filteredRecords = mockRecords.filter(r => 
                r.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                r.asset.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navigation */}
                    <nav className="bg-slate-900 text-white shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center">
                                    <span className="font-bold text-xl tracking-tight">Asset Records <span className="text-blue-400 text-sm font-normal">SaaS</span></span>
                                    <div className="ml-10 flex items-baseline space-x-4">
                                        <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-2 rounded-md text-sm font-medium ${activeTab === 'dashboard' ? 'bg-slate-800 text-white' : 'text-slate-300 hover:bg-slate-700'}`}>Project Dashboard</button>
                                        <button onClick={() => setActiveTab('records')} className={`px-3 py-2 rounded-md text-sm font-medium ${activeTab === 'records' ? 'bg-slate-800 text-white' : 'text-slate-300 hover:bg-slate-700'}`}>Records Repository</button>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="h-2 w-2 bg-green-400 rounded-full animate-pulse"></span>
                                    <span className="text-xs text-slate-400">System Compliant (ATA 2500)</span>
<div style={{ width: '1080px', height: '1080px', position: 'relative' }}>
  <DotGrid
    dotSize={12}
    gap={15}
    baseColor="#1f3825"
    activeColor="#7eff29"
    proximity={200}
    speedTrigger={100}
    shockRadius={250}
    shockStrength={5}
    maxSpeed={5000}
    resistance={750}
    returnDuration={1.5}
  />
</div>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content Area - Single Pane  */}
                    <main className="flex-1 bg-slate-50 p-8">
                        <div className="max-w-7xl mx-auto">
                            
                            {/* PROJECT MANAGEMENT MODULE  */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {/* Efficiency Stat  */}
                                        <div className="bg-white p-6 rounded-lg shadow border-l-4 border-blue-600">
                                            <h3 className="text-slate-500 text-sm font-medium uppercase">Documentation Efficiency</h3>
                                            <div className="mt-2 flex items-baseline">
                                                <span className="text-4xl font-extrabold text-slate-900">32%</span>
                                                <span className="ml-2 text-sm text-green-600 font-medium">Time Saved / Flight</span>
                                            </div>
                                            <p className="mt-1 text-xs text-slate-400">Estimated reduction vs manual entry</p>
                                        </div>
                                        
                                        <div className="bg-white p-6 rounded-lg shadow border-l-4 border-indigo-600">
                                            <h3 className="text-slate-500 text-sm font-medium uppercase">Active Projects</h3>
                                            <div className="mt-2 flex items-baseline">
                                                <span className="text-4xl font-extrabold text-slate-900">{mockProjects.length}</span>
                                                <span className="ml-2 text-sm text-indigo-600 font-medium">Ongoing</span>
                                            </div>
                                            <p className="mt-1 text-xs text-slate-400">Lease Transfers & MRO Visits</p>
                                        </div>

                                        <div className="bg-white p-6 rounded-lg shadow border-l-4 border-green-600">
                                            <h3 className="text-slate-500 text-sm font-medium uppercase">Records Digitized</h3>
                                            <div className="mt-2 flex items-baseline">
                                                <span className="text-4xl font-extrabold text-slate-900">1.3B+</span>
                                            </div>
                                            <p className="mt-1 text-xs text-slate-400">Global Repository Scale</p>
                                        </div>
                                    </div>

                                    {/* Projects Grid */}
                                    <h2 className="text-lg font-bold text-slate-800">Active Workflow Projects</h2>
                                    <div className="bg-white shadow overflow-hidden sm:rounded-md">
                                        <ul className="divide-y divide-slate-200">
                                            {mockProjects.map(project => (
                                                <li key={project.id}>
                                                    <div className="px-4 py-4 sm:px-6 hover:bg-slate-50 transition cursor-pointer">
                                                        <div className="flex items-center justify-between">
                                                            <div className="text-sm font-medium text-blue-600 truncate">{project.name}</div>
                                                            <div className="ml-2 flex-shrink-0 flex">
                                                                <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${project.status === 'In Progress' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>
                                                                    {project.status}
                                                                </span>
                                                            </div>
                                                        </div>
                                                        <div className="mt-2 sm:flex sm:justify-between">
                                                            <div className="sm:flex">
                                                                <p className="flex items-center text-sm text-slate-500">
                                                                    Asset: {project.asset}
                                                                </p>
                                                            </div>
                                                            <div className="mt-2 flex items-center text-sm text-slate-500 sm:mt-0">
                                                                <p>Tasks Completed: <span className="font-bold text-slate-700">{project.tasks}</span></p>
                                                                <div className="ml-4 w-24 bg-slate-200 rounded-full h-2.5">
                                                                    <div className="bg-blue-600 h-2.5 rounded-full" style={{width: `${project.progress}%`}}></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {/* RECORDS MANAGEMENT MODULE [cite: 11] */}
                            {activeTab === 'records' && (
                                <div className="space-y-6">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-lg font-bold text-slate-800">Digital Records Repository</h2>
                                        <div className="flex gap-2">
                                            <button className="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded text-sm font-medium hover:bg-slate-50">Upload Package</button>
                                            <button className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700">Transfer via ATA 2500</button>
                                        </div>
                                    </div>

                                    {/* Search Bar  */}
                                    <div className="relative">
                                        <input 
                                            type="text" 
                                            className="block w-full pl-4 pr-10 py-3 border border-slate-300 rounded-lg leading-5 bg-white placeholder-slate-500 focus:outline-none focus:placeholder-slate-400 focus:ring-1 focus:ring-blue-500 sm:text-sm" 
                                            placeholder="Search by Asset ID, ATA Chapter, or Document Name..." 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                        />
                                    </div>

                                    {/* Records Table */}
                                    <div className="bg-white shadow overflow-hidden rounded-lg">
                                        <table className="min-w-full divide-y divide-slate-200">
                                            <thead className="bg-slate-50">
                                                <tr>
                                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Document Name</th>
                                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Asset</th>
                                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">ATA / IATA</th>
                                                    <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Compliance</th>
                                                    <th className="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-slate-200">
                                                {filteredRecords.map(record => (
                                                    <tr key={record.id}>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <div className="flex items-center">
                                                                <svg className="flex-shrink-0 h-5 w-5 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
                                                                    <path fillRule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clipRule="evenodd" />
                                                                </svg>
                                                                <span className="ml-2 text-sm font-medium text-slate-900">{record.name}</span>
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{record.asset}</td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
                                                            <span className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded text-xs font-mono mr-1">{record.ata}</span>
                                                            <span className="text-xs text-slate-400">{record.iata}</span>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            {record.compliant ? (
                                                                <span className="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Verified</span>
                                                            ) : (
                                                                <span className="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Missing Sig</span>
                                                            )}
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                            <a href="#" className="text-blue-600 hover:text-blue-900">Download</a>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                        {filteredRecords.length === 0 && (
                                            <div className="p-8 text-center text-slate-500">
                                                No records found matching your query.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
